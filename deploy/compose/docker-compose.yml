# Local development database: Postgres 17 with pgvector. Matches Supabase's engine and the
# schema api/src/db/schema.ts creates (run `npm run db:init -w api`, then `npm run seed -w api`).
#   DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54322:5432"
volumes:
  pg-data: {}
