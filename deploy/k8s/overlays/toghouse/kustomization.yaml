apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Environment-specific additions: internal TLS, Vault-backed secrets and a public tunnel.
# The application connects to the configured PostgreSQL database through DATABASE_URL.
namespace: conference-companion
resources:
  - ../../tls
  - pki.yaml
  - secrets.yaml
  - cloudflared.yaml
images:
  - name: cc-api
    newName: ghcr.io/dl4p1n/conference-companion-api
    digest: sha256:40e955c8f16c5f15b4b602a386043a2b593dfa262864073dbe969eacb3f7bb54
  - name: cc-web
    newName: ghcr.io/dl4p1n/conference-companion-web
    digest: sha256:43f7616f6070d80523c0ade316c9ca98357514396ea38b6d8706ecf05c7b95e0
patches:
  # This environment trusts two proxies: the web Service and its public tunnel.
  - target: {kind: ConfigMap, name: companion-app-config}
    patch: |-
      - op: replace
        path: /data/TRUST_PROXY
        value: "2"
      - op: add
        path: /data/DATABASE_CA_FILE
        value: /etc/database/database-ca.crt
      - op: add
        path: /data/REGISTER_RATE_LIMIT_PER_MINUTE
        value: "10"
configMapGenerator:
  # This environment uses a private root CA for its external PostgreSQL service.
  - name: companion-database-ca
    files:
      - database-ca.crt=supabase-ca.crt
    options:
      disableNameSuffixHash: true
      annotations:
        # Live object carries a stray supabase-ca.crt key added outside apply; Replace drops it.
        argocd.argoproj.io/sync-options: Replace=true
