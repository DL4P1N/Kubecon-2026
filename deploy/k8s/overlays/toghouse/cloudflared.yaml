# Remotely managed named tunnel "conference-companion". The public hostname
# conference-companion.ecan.pro routes to https://web.conference-companion.svc.cluster.local:8080
# with SNI web.conference-companion.svc.cluster.local and CA pool /etc/cloudflared/ca/ca.crt
# (configured in the Cloudflare dashboard). Certificate verification stays on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: conference-companion}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: conference-companion}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.2.0
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: cloudflared-token, key: token}}
          ports:
            - {name: metrics, containerPort: 2000}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: web-ca, mountPath: /etc/cloudflared/ca, readOnly: true}
      volumes:
        - name: web-ca
          secret:
            secretName: companion-web-tls
            items:
              - {key: ca.crt, path: ca.crt}
