# Local disk for the single ES node, and a CA-signed certificate instead of the
# self-signed one: transport peers and probes trust ca.crt, not the leaf.
- op: add
  path: /spec/volumeClaimTemplates/0/spec/storageClassName
  value: local-path
- op: replace
  path: /spec/template/spec/containers/0/startupProbe/exec/command/2
  value: 'curl --silent --fail --cacert config/certs/ca.crt --user "elastic:$ELASTIC_PASSWORD" https://localhost:9200/ >/dev/null'
- op: replace
  path: /spec/template/spec/containers/0/readinessProbe/exec/command/2
  value: 'curl --silent --fail --cacert config/certs/ca.crt --user "elastic:$ELASTIC_PASSWORD" https://localhost:9200/ >/dev/null'
- op: replace
  path: /spec/template/spec/containers/0/env/11/value
  value: certs/ca.crt
