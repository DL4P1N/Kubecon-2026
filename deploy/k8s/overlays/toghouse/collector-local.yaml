# No Dash0 tenant: telemetry stays inside the collector. The allowlist processor
# still runs; the only exporter is debug (basic), so nothing leaves the cluster.
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/allowlist, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [transform/allowlist, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [transform/allowlist, batch]
      exporters: [debug]
