# One internal CA signs every transport certificate (api, web, collector), so the
# API trusts exactly that CA for its collector connection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - {name: NODE_EXTRA_CA_CERTS, value: /etc/companion-tls/ca.crt}
