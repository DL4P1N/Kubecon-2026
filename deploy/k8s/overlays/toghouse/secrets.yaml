# Vault access without a static credential: ESO presents the eso-vault-auth
# ServiceAccount token to Vault's kubernetes auth method (role
# conference-companion-eso, read-only on kv/apps/conference-companion/*).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
---
# Vault validates the caller by sending its own token to TokenReview, which
# needs system:auth-delegator for that ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: conference-companion-eso-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: eso-vault-auth
    namespace: conference-companion
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.ecan.pro:8200
      path: kv
      version: v2
      # Public chain of the toghouse intermediate and root CA (pki_int, pki).
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: conference-companion-eso
          serviceAccountRef: {name: eso-vault-auth}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: companion-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: companion-app-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: apps/conference-companion/app}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elasticsearch-admin
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: elasticsearch-admin, creationPolicy: Owner}
  data:
    - secretKey: password
      remoteRef: {key: apps/conference-companion/elasticsearch, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: cloudflared-token, creationPolicy: Owner}
  data:
    - secretKey: token
      remoteRef: {key: apps/conference-companion/cloudflared, property: token}
