apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - { name: API_TLS_CERT_FILE, value: /etc/companion-tls/tls.crt }
            - { name: API_TLS_KEY_FILE, value: /etc/companion-tls/tls.key }
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/companion-tls/ca-bundle.crt }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "https://otel-collector:4318" }
          startupProbe:
            httpGet:
              scheme: HTTPS
          readinessProbe:
            httpGet:
              scheme: HTTPS
          livenessProbe:
            httpGet:
              scheme: HTTPS
          volumeMounts:
            - { name: transport-tls, mountPath: /etc/companion-tls, readOnly: true }
      volumes:
        - name: transport-tls
          secret:
            secretName: companion-api-tls
