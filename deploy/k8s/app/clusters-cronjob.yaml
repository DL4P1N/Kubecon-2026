# Module 4 cluster map batch: k-means runs in this Node job (not in Elasticsearch),
# reads opted-in attendees' interest vectors and writes aggregate clusters
# (each at least 5 members) to the interest_clusters index. See docs/cluster-map.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: companion-clusters
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: clusters
              # Use the same release tag as the API Deployment.
              image: cc-api:local
              imagePullPolicy: IfNotPresent
              command: ["node", "dist/clusters/cli.js"]
              envFrom:
                - configMapRef:
                    name: companion-app-config
                - secretRef:
                    name: companion-app-secrets
              volumeMounts:
                - name: database-ca
                  mountPath: /etc/database
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: database-ca
              configMap:
                name: companion-database-ca
                optional: true
