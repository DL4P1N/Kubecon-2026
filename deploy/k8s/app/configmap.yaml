apiVersion: v1
kind: ConfigMap
metadata:
  name: companion-app-config
  labels:
    app.kubernetes.io/name: companion
    app.kubernetes.io/part-of: conference-companion
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  # One trusted nginx hop on the local web -> API path; not arbitrary proxies.
  TRUST_PROXY: "1"
  # Never spawn the Claude CLI in a public deployment.
  CHAT_MODE: scripted
  # DATABASE_URL is a secret (companion-app-secrets). Database TLS uses system roots by default;
  # a deployment with a private database CA sets DATABASE_CA_FILE in its environment overlay.
  MODEL_CACHE_DIR: /app/models
  MODEL_ALLOW_DOWNLOAD: "false"
