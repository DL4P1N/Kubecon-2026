apiVersion: v1
kind: ConfigMap
metadata:
  name: companion-app-config
  labels:
    app.kubernetes.io/name: companion
    app.kubernetes.io/part-of: conference-companion
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  # One trusted nginx hop on the local web -> API path; not arbitrary proxies.
  TRUST_PROXY: "1"
  # DATABASE_URL is a secret (companion-app-secrets). Trust root for its TLS certificate:
  DATABASE_CA_FILE: /etc/database/supabase-ca.crt
  # The embedding model is baked into the image; the pod never downloads it.
  MODEL_CACHE_DIR: /app/models
  MODEL_ALLOW_DOWNLOAD: "false"
  OTEL_SERVICE_NAME: companion-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
