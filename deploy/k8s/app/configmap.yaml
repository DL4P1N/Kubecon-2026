apiVersion: v1
kind: ConfigMap
metadata:
  name: companion-app-config
  labels:
    app.kubernetes.io/name: companion
    app.kubernetes.io/part-of: conference-companion
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  # One trusted nginx hop on the local web -> API path; not arbitrary proxies.
  TRUST_PROXY: "1"
  # DATABASE_URL is a secret (companion-app-secrets). System trust roots are used by default;
  # private database CAs are mounted and configured by an environment overlay.
  MODEL_CACHE_DIR: /app/models
  MODEL_ALLOW_DOWNLOAD: "false"
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: companion-api
