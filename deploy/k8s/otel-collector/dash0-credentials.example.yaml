# Do not commit a populated Secret. Create it locally with:
# kubectl -n <namespace> create secret generic dash0-credentials \
#   --from-literal=endpoint=https://<tenant>.dash0.com/api/otlp \
#   --from-literal=token='<Dash0 authorization token>'
apiVersion: v1
kind: Secret
metadata:
  name: dash0-credentials
type: Opaque
stringData:
  endpoint: "https://<tenant>.dash0.com/api/otlp"
  token: "replace-me"
