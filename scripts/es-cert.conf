[req]
distinguished_name = dn
x509_extensions = extensions
prompt = no
[dn]
CN = elasticsearch
[extensions]
subjectAltName = DNS:localhost,DNS:elasticsearch,DNS:elasticsearch.conference-companion.svc,DNS:elasticsearch.conference-companion.svc.cluster.local,IP:127.0.0.1
basicConstraints = critical,CA:TRUE
keyUsage = critical,digitalSignature,keyEncipherment,keyCertSign
extendedKeyUsage = serverAuth,clientAuth
